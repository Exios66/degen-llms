<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="The Mandalay Bay — pixel RPG casino adventure. Explore the resort, talk to NPCs, and play every casino game.">
  <meta name="theme-color" content="#0a0812">
  <title>The Mandalay Bay — Pixel RPG</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Terminal styles come first so the RPG's pixel skin overrides them. -->
  <link rel="stylesheet" href="../css/casino.css">
  <link rel="stylesheet" href="css/rpg.css">
  <link rel="stylesheet" href="../css/intoxication-effects.css">
  <link rel="stylesheet" href="../css/rewards-phone.css">
  <script type="importmap">
  {
    "imports": {
      "phaser": "./js/phaser-shim.js"
    }
  }
  </script>
</head>
<body>
  <div id="game-shell" class="arcade-cabinet">
    <div id="phaser-root"></div>
    <div id="hud" aria-live="polite"></div>
    <div id="map-banner" hidden aria-live="polite"></div>
    <div id="touch-hint" class="touch-hint" aria-hidden="true">Tap to move · Tap to talk</div>
    <div id="touch-pad" class="touch-pad" hidden></div>
    <div id="rewards-phone" aria-live="polite"></div>
    <div id="trainer-card" hidden aria-live="polite"></div>
    <div id="dialogue-overlay" hidden aria-live="polite"></div>
    <div id="blackjack-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="roulette-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="holdem-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="rhythm-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="terminal-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="menu-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="title-overlay" aria-live="polite"></div>
  </div>
  <script type="module" src="js/main.js?v=ds-sprites-1"></script>
</body>
</html>
