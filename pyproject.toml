[project]
name = "degen-llms"
version = "1.0.0"
description = "The Mandalay Bay monorepo — digital casino CLI, web terminal, and pixel RPG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Publishable Mandalay Bay CLI package: mandalay-bay.toml
#   bash scripts/build_mandalay_bay_package.sh

[project.scripts]
mandalay-bay = "mandalay_bay.main:main"
blackjack = "blackjack.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["blackjack*", "mandalay_bay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
venvPath = "."
venv = ".venv"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
