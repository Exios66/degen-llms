  <script type="module" src="js/main.js?v=6815570"></script>
  <script>
    // Surface module-load failures that would otherwise leave a blank title.
    window.addEventListener("error", (event) => {
      const el = document.getElementById("title-boot-error");
      const overlay = document.getElementById("title-overlay");
      if (!el || !overlay || overlay.hidden) return;
      if (!event.message && !event.error) return;
      el.hidden = false;
      el.textContent = "Could not load Pixel RPG. Refresh, or open Terminal casino mode.";
    });
    window.addEventListener("unhandledrejection", () => {
      const el = document.getElementById("title-boot-error");
      const overlay = document.getElementById("title-overlay");
      if (!el || !overlay || overlay.hidden) return;
      el.hidden = false;
      el.textContent = "Could not load Pixel RPG. Refresh, or open Terminal casino mode.";
    });
  </script>
