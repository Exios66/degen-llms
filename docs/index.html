<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Mandalay Bay — digital casino with hotel experience, MGM Rewards, and pixel RPG open world. Blackjack, slots, sports book, and more in your browser.">
  <meta name="theme-color" content="#0a0e14">
  <meta property="og:title" content="The Mandalay Bay — Digital Casino">
  <meta property="og:description" content="Casino floor, hotel reservations, MGM Rewards, and pixel RPG — terminal-style play in your browser.">
  <meta property="og:type" content="website">
  <title>The Mandalay Bay — Digital Casino</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/casino.css?v=726c8e9">
  <link rel="stylesheet" href="css/intoxication-effects.css?v=726c8e9">
  <link rel="stylesheet" href="css/rewards-phone.css?v=726c8e9">
</head>
<body>
  <div id="app" aria-live="polite">
    <noscript>
      <div class="loading-screen">
        <div class="banner"><h1>The Mandalay Bay</h1></div>
        <p style="color:#f07178;font-family:monospace;padding:1rem;text-align:center;">
          JavaScript is required. Enable it to play blackjack, slots, and the sports book.
        </p>
      </div>
    </noscript>
    <div class="loading-screen loading-screen--cabinet" id="boot-loader">
      <div class="cabinet-title-bezel">
        <div class="cabinet-title-marquee">
          <span class="cabinet-title-marquee-text">THE MANDALAY BAY</span>
        </div>
        <div class="cabinet-title-screen">
          <div class="cabinet-title-felt" aria-hidden="true"></div>
          <div class="cabinet-title-content">
            <p class="cabinet-title-eyebrow">Welcome to</p>
            <h1 class="cabinet-title-logo">The Mandalay Bay</h1>
            <div class="cabinet-title-rule" aria-hidden="true"></div>
            <p class="cabinet-title-tagline">Digital Table Games · Cabinet Edition</p>
            <p class="cabinet-title-hint">Opening the floor&hellip;</p>
          </div>
        </div>
        <div class="cabinet-title-rail" aria-hidden="true">
          <span class="cabinet-title-rail-lamp"></span>
          <span class="cabinet-title-rail-lamp"></span>
          <span class="cabinet-title-rail-lamp"></span>
          <span class="cabinet-title-rail-lamp"></span>
          <span class="cabinet-title-rail-lamp"></span>
        </div>
      </div>
    </div>
  </div>
  <div id="rewards-phone" aria-live="polite"></div>
  <div id="arcade-overlay" class="arcade-overlay" aria-hidden="true" aria-live="polite"></div>
  <script type="module" src="js/app.js?v=726c8e9"></script>
  <script>
    window.addEventListener("error", function (e) {
      var app = document.getElementById("app");
      if (!app || app.dataset.bootError || window.__casinoReady) return;
      app.dataset.bootError = "1";
      app.innerHTML = "<div class=\"loading-screen\"><div class=\"banner\"><h1>The Mandalay Bay</h1></div>"
        + "<p class=\"error\">Could not start the casino: " + (e.message || "unknown error") + "</p>"
        + "<p class=\"dim\">Try a hard refresh. If this persists, check the browser console.</p></div>";
    });
  </script>
</body>
</html>
