<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  body { margin: 0; background: #1b1b26; color: #eee; font: 12px monospace; }
  .row { display: flex; gap: 10px; align-items: flex-end; padding: 10px; flex-wrap: wrap; }
  canvas { image-rendering: pixelated; background: #2e2e3e; }
  h2 { margin: 6px 10px 0; font-size: 13px; color: #f0d050; }
</style></head>
<body>
<div id="out"></div>
<script type="module">
import { drawCharacterToCanvas, drawArtToCanvas, artKeys } from "./js/systems/TextureFactory.js";
import { resolvePalette, SKIN_TONES, HAIR_COLORS, OUTFIT_COLORS, NPC_PORTRAITS, SPEAKER_PORTRAITS, resolveSpeakerPortrait } from "./js/systems/CharacterAppearance.js";

const out = document.getElementById("out");
const Z = 14;

function section(title) {
  const h = document.createElement("h2");
  h.textContent = title;
  out.appendChild(h);
  const row = document.createElement("div");
  row.className = "row";
  out.appendChild(row);
  return row;
}

function chr(row, palette, dir, frame) {
  const c = document.createElement("canvas");
  drawCharacterToCanvas(c, palette, dir, frame, Z);
  row.appendChild(c);
}

const base = resolvePalette({ skin: "fair", hair: "teal", outfit: "teal" });
let row = section("player · down/up/left/right × frames 0,1,2");
for (const dir of ["down", "up", "left", "right"]) {
  for (const f of [1, 0, 2]) chr(row, base, dir, f);
}
row = section("fair skin / chestnut hair / crimson");
for (const dir of ["down", "up", "left", "right"]) chr(row, resolvePalette({skin:"fair",hair:"chestnut",outfit:"crimson"}), dir, 0);

row = section("skin tones (down)");
for (const s of SKIN_TONES) chr(row, resolvePalette({ skin: s.id, hair: "chestnut", outfit: "navy" }), "down", 0);

row = section("hair colors (down)");
for (const h of HAIR_COLORS) chr(row, resolvePalette({ skin: "medium", hair: h.id, outfit: "navy" }), "down", 0);

row = section("outfits (down)");
for (const o of OUTFIT_COLORS) chr(row, resolvePalette({ skin: "medium", hair: "black", outfit: o.id }), "down", 0);

row = section("npc portraits");
for (const s of Object.keys(SPEAKER_PORTRAITS).slice(0, 10)) chr(row, resolveSpeakerPortrait(s), "down", 0);

row = section("tiles + props");
for (const key of artKeys()) {
  const c = document.createElement("canvas");
  drawArtToCanvas(c, key);
  c.style.width = `${c.width * 3}px`;
  c.style.height = `${c.height * 3}px`;
  row.appendChild(c);
}
window.__sheetReady = true;
</script>
</body>
</html>
