name: Sync GitHub Wiki

# Mirror wiki/ (source of truth in the repo) to the GitHub wiki on every push to main.
# The wiki is a separate git repo (.wiki.git). If the wiki has never been used,
# create any page once in the GitHub Wiki tab so .wiki.git exists, then re-run.
on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/sync-github-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish:
    name: Push wiki/ to GitHub wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Mirror wiki/ into the wiki repo and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -d wiki ] || [ -z "$(ls -A wiki 2>/dev/null)" ]; then
            echo "::error::wiki/ is missing or empty; nothing to sync."
            exit 1
          fi

          WIKI_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git clone --depth 1 "$WIKI_URL" wiki_repo 2>/dev/null; then
            echo "Wiki repo not found — initializing with force push ..."
            mkdir -p wiki_repo
            cd wiki_repo
            git init
            git checkout -b main
            cp -r ../wiki/. .
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Initialize wiki from ${GITHUB_SHA}"
            git remote add origin "$WIKI_URL"
            git push -f origin main
            echo "Wiki initialized."
            exit 0
          fi

          find wiki_repo -maxdepth 1 -type f -name '*.md' -delete
          cp wiki/*.md wiki_repo/

          cd wiki_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki already up to date; nothing to push."
            exit 0
          fi

          git commit -m "Sync wiki from ${GITHUB_SHA}"
          git push origin HEAD
          echo "Wiki synced."
