<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="The Mandalay Bay — pixel RPG casino adventure. Explore the resort, talk to NPCs, and play every casino game.">
  <meta name="theme-color" content="#0a0812">
  <title>The Mandalay Bay — Pixel RPG</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Terminal styles come first so the RPG's pixel skin overrides them. -->
  <link rel="stylesheet" href="../css/casino.css?v=tuxedo-pixel-1">
  <link rel="stylesheet" href="css/rpg.css?v=tuxedo-pixel-1">
  <link rel="stylesheet" href="../css/intoxication-effects.css">
  <link rel="stylesheet" href="../css/rewards-phone.css">
  <script type="importmap">
  {
    "imports": {
      "phaser": "./js/phaser-shim.js"
    }
  }
  </script>
</head>
<body>
  <div id="game-shell" class="arcade-cabinet">
    <div id="phaser-root"></div>
    <div id="hud" aria-live="polite"></div>
    <div id="map-banner" hidden aria-live="polite"></div>
    <div id="touch-hint" class="touch-hint" aria-hidden="true">Tap to move · Tap to talk</div>
    <div id="touch-pad" class="touch-pad" hidden></div>
    <div id="rewards-phone" aria-live="polite"></div>
    <div id="trainer-card" hidden aria-live="polite"></div>
    <div id="dialogue-overlay" hidden aria-live="polite"></div>
    <div id="blackjack-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="roulette-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="holdem-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="rhythm-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="vegas-strip-drive-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="terminal-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="menu-overlay" class="encounter-overlay" hidden aria-live="polite"></div>
    <div id="title-overlay" class="title-overlay--intro" aria-live="polite">
      <div class="title-boot-fallback" id="title-boot-fallback">
        <p class="title-intro-eyebrow">Welcome to</p>
        <h1 class="title-intro-logo">The Mandalay Bay</h1>
        <p class="title-intro-tagline">Pixel RPG · Loading…</p>
        <p class="title-boot-error" id="title-boot-error" hidden></p>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js?v=strip-drive-road-2"></script>
  <script>
    // Surface module-load failures that would otherwise leave a blank title.
    window.addEventListener("error", (event) => {
      const el = document.getElementById("title-boot-error");
      const overlay = document.getElementById("title-overlay");
      if (!el || !overlay || overlay.hidden) return;
      if (!event.message && !event.error) return;
      el.hidden = false;
      el.textContent = "Could not load Pixel RPG. Refresh, or open Terminal casino mode.";
    });
    window.addEventListener("unhandledrejection", () => {
      const el = document.getElementById("title-boot-error");
      const overlay = document.getElementById("title-overlay");
      if (!el || !overlay || overlay.hidden) return;
      el.hidden = false;
      el.textContent = "Could not load Pixel RPG. Refresh, or open Terminal casino mode.";
    });
  </script>
</body>
</html>
